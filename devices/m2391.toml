[device]
codename = "m2391"
brand = "Meizu"
model = "MEIZU 20 Pro"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }

[display]
# The panel's preferred DSI mode in recovery is 1080x2400 (matching
# TARGET_RECOVERY_UI_SCREEN_WIDTH := 1080); 420 dpi gives 411 dp width.
width = 1080
height = 2400
density = 420
diagonal = 6.81
corner_radius = 82

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# goodix_ts drives the Goodix touchscreen (already in first-stage recovery
# on LineageOS; loading again is a no-op). haptic_hv drives the Awinic
# AW8697 linear motor and exposes /sys/class/meizu/motor.
load = ["goodix_ts", "haptic_hv"]

[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# WLAN: WCN7850 on PCIe driven by qca_cld3_kiwi_v2 over cnss2.
# /vendor/firmware already symlinks WCNSS_qcom_cfg.ini into /vendor/etc/wifi
# and wlan_mac.bin into /mnt/vendor/persist (mounted above).
# On LineageOS 24.0 for m2391 the supplicant binary is installed as
# /vendor/bin/hw/wpa_supplicant.m2391.
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant.m2391"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Awinic AW8697 motor controlled through Meizu's /sys/class/meizu/motor
# sysfs interface (set_mback + gain).
[haptics]
sysfs = "/sys/class/meizu/motor"
strength = { lightest = 0.25, strongest = 1.0 }

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist", "private", "proinfo", "param"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

[wipe]
logs = [
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
